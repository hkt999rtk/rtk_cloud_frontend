name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    runs-on: [self-hosted, rtk_cloud_frontend, go]

    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify video asset
        id: verify_video_asset
        shell: bash
        run: |
          test "$(wc -c < static/assets/realtek-brand-film.mp4)" -gt 1000000

      - name: Check Go toolchain
        run: go version

      - name: Ensure PyYAML is available
        shell: bash
        run: |
          if ! python3 -c 'import yaml'; then
            sudo -n apt-get update
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y python3-yaml
          fi

      - name: Check SDK manual source
        run: python3 -m unittest discover -s tools/tests -p 'test_build_sdk_docs.py'

      - name: Check Go formatting
        id: gofmt
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        id: tests
        run: go test -count=1 -timeout=3m ./...

      - name: Build server
        id: build
        run: go build ./cmd/server

      - name: Ensure Chrome is available
        shell: bash
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v chromium >/dev/null 2>&1 \
            && ! command -v chromium-browser >/dev/null 2>&1; then
            chrome_root="${RUNNER_TOOL_CACHE}/chrome-for-testing"
            chrome_path="${chrome_root}/chrome-linux64/chrome"
            if [ ! -x "$chrome_path" ]; then
              chrome_version="$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)"
              chrome_archive="${RUNNER_TEMP}/chrome-linux64.zip"
              mkdir -p "$chrome_root"
              curl -fsSL \
                "https://storage.googleapis.com/chrome-for-testing-public/${chrome_version}/linux64/chrome-linux64.zip" \
                -o "$chrome_archive"
              python3 -m zipfile -e "$chrome_archive" "$chrome_root"
            fi
            chmod +x "$chrome_path"
            printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          fi

      - name: Run visual smoke
        id: visual_smoke
        shell: bash
        run: |
          if [ -x "${CHROME_PATH:-}" ] || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1; then
            go run ./cmd/visual-smoke
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "Chrome is not available on this runner; recording visual smoke as SKIP."
            echo "result=SKIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CI report candidate
        if: always()
        shell: bash
        env:
          REPORT_ASSET_RESULT: ${{ steps.verify_video_asset.outcome == 'success' && 'PASS' || 'FAIL' }}
          REPORT_GOFMT_RESULT: ${{ steps.gofmt.outcome == 'success' && 'PASS' || 'FAIL' }}
          REPORT_TEST_RESULT: ${{ steps.tests.outcome == 'success' && 'PASS' || 'FAIL' }}
          REPORT_BUILD_RESULT: ${{ steps.build.outcome == 'success' && 'PASS' || 'FAIL' }}
          REPORT_VISUAL_SMOKE_RESULT: ${{ steps.visual_smoke.outputs.result || 'FAIL' }}
        run: |
          chmod +x scripts/generate_report_candidate.sh scripts/validate_report_candidate.sh
          scripts/generate_report_candidate.sh ci .artifacts/report-candidates/docs/TEST_REPORT.md
          scripts/validate_report_candidate.sh .artifacts/report-candidates/docs/TEST_REPORT.md docs/TEST_REPORT.md

      - name: Check CI report drift
        shell: bash
        run: |
          diff -u docs/TEST_REPORT.md .artifacts/report-candidates/docs/TEST_REPORT.md
