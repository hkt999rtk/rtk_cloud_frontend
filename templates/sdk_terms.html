{{define "content"}}
<section class="page-hero docs-hero">
  <p class="eyebrow">SDK evaluation</p>
  {{if .SDKDownloadError}}<h1>SDK Evaluation Terms</h1>{{end}}
  {{if .SDKTermsVersion}}<p>Terms version: <strong>{{.SDKTermsVersion}}</strong></p>{{end}}
</section>
<section class="section">
  {{if .SDKDownloadError}}
  <p class="form-error">{{.SDKDownloadError}}</p>
  {{else}}
  <article class="manual-content sdk-terms">{{.SDKTerms}}</article>
  {{end}}
</section>
{{end}}
