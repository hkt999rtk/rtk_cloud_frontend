{{define "content"}}
<section class="legal-page">
  <div class="legal-paper">
    <div class="legal-paper-masthead" aria-hidden="true">
      <span>Realtek Connect+</span>
      <span>SDK evaluation</span>
    </div>
    {{if .SDKDownloadError}}
    <h1>SDK Evaluation Terms</h1>
    <p class="form-error">{{.SDKDownloadError}}</p>
    {{else}}
    <article class="manual-content sdk-terms" aria-label="SDK Evaluation Terms">{{.SDKTerms}}</article>
    {{end}}
  </div>
</section>
{{end}}
