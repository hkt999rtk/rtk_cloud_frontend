{{define "content"}}
<section class="portal-not-found" aria-labelledby="not-found-title">
  <div class="portal-not-found-copy">
    <p class="eyebrow">404</p>
    <h1 id="not-found-title">{{t . "not_found.heading"}}</h1>
    <p>{{t . "not_found.body"}}</p>
    <div class="hero-actions" aria-label="{{t . "not_found.actions"}}">
      <a class="button primary" href="{{localizedPath . "/"}}">{{t . "not_found.home"}}</a>
      <button class="button secondary" type="button" onclick="if (window.history.length &gt; 1) window.history.back(); else window.location.assign('{{localizedPath . "/"}}')">{{t . "not_found.back"}}</button>
    </div>
  </div>
  <div class="portal-not-found-art" aria-hidden="true">
    <span class="not-found-orbit orbit-one"></span><span class="not-found-orbit orbit-two"></span>
    <div class="not-found-cloud"><span></span><span></span><span></span></div>
    <div class="not-found-device"><i></i><i></i><i></i></div>
    <span class="not-found-signal signal-one"></span><span class="not-found-signal signal-two"></span>
  </div>
</section>
{{end}}
