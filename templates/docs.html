{{define "content"}}
<section class="page-hero docs-access">
  <p class="eyebrow">{{t . "docs.eyebrow"}}</p>
  <h1>{{.DocsPage.Title}}</h1>
  <p class="docs-access-subtitle">{{.DocsPage.Subtitle}}</p>
  <div class="docs-access-description">{{.DocsPage.BodyHTML}}</div>
  <div class="hero-actions">
    <a class="button primary" href="{{.ServiceSignupURL}}" data-analytics-cta="docs_cta_signup"><span class="button-icon">{{icon "arrow-right"}}</span>{{.DocsPage.SignupCTA}}</a>
    <a class="button secondary" href="{{.ServiceDocsLoginURL}}" data-analytics-cta="docs_cta_login">{{.DocsPage.LoginCTA}}</a>
  </div>
</section>
{{end}}
